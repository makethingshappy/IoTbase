kind: carrier
product: IoTbase PICO
revision: "3.06"
# HOST AP0-AP7 / I2C -> MCU pin of the plug-in board
# Source: IoTbase PICO 3.06 schematic (HOST net -> Pico header pin)
#       + vendor schematic / datasheet of each board (header pin -> GPIO)
# Socket: AP0=14 AP1=15 AP2=16 AP3=17 AP4=19 AP5=20 AP6=29 AP7=25 SDA=26 SCL=27 (Pico pin numbers)
# Change vs 3.05: AP6 moved from pin 24 to pin 29
boards:
  pico:
    vendor: Raspberry Pi
    model: Pico / Pico W
    mcu: RP2040
    host: &rp_host
      AP0: 10
      AP1: 11
      AP2: 12
      AP3: 13
      AP4: 14
      AP5: 15
      AP6: 22
      AP7: 19
      I2C:
        bus: 0        # fixed by pins: GP20/GP21 = I2C0
        SDA: 20
        SCL: 21
  pico2:
    vendor: Raspberry Pi
    model: Pico 2 / Pico 2 W
    mcu: RP2350A
    host: *rp_host
  rp2350-plus:
    vendor: Waveshare
    model: RP2350-Plus
    mcu: RP2350A
    host: *rp_host
  rp2350b-plus-w:
    vendor: Waveshare
    model: RP2350B-Plus-W
    mcu: RP2350B
    host: *rp_host
  esp32-s3-pico:
    vendor: Waveshare
    model: ESP32-S3-Pico
    mcu: ESP32-S3
    host:
      AP0: 35
      AP1: 36
      AP2: 37
      AP3: 38
      AP4: 39
      AP5: 40
      AP6: 6
      AP7: 2
      I2C:
        bus: 0        # convention: ESP32 routes I2C via GPIO matrix
        SDA: 4
        SCL: 5
  esp32-c6-pico:
    vendor: Waveshare
    model: ESP32-C6-Pico
    mcu: ESP32-C6
    # Pico pins 19, 20, 25, 29 are not MCU GPIO on this board:
    # they are I/O of the on-board I2C expander TCA9554 (Extend_IO6, IO7, IO2, IO1), on the HOST I2C bus
    expander:
      chip: TCA9554
      bus: 0
      address: "0x20"   # A0 = GND via R24 (0R; R16 to 3V3 not fitted), A1 = A2 = GND
      # Same address range as TCA9534 on IoTextra modules (0x20-0x27): do not set an IoTextra TCA9534 to 0x20
    # Alternative: on IoTextra modules with a TCA9534 (parallel wiring) channels on AP4-AP7
    # can be accessed directly via the module expander bits P4-P7; leave TCA9554 P0, P1, P5, P6 as inputs (power-up default)
    host:
      AP0: 18
      AP1: 19
      AP2: 20
      AP3: 21
      AP4: {expander: TCA9554, pin: P5}
      AP5: {expander: TCA9554, pin: P6}
      AP6: {expander: TCA9554, pin: P0}
      AP7: {expander: TCA9554, pin: P1}
      I2C:
        bus: 0        # convention: ESP32 routes I2C via GPIO matrix
        SDA: 22
        SCL: 23
